# Build the 3D Model Anything iPhone app on a GitHub-hosted Mac and ship it to TestFlight.
# No local Mac needed.
#
# Two modes:
#   push (touching the app or this file)  -> unsigned compile check only. No secrets needed.
#   workflow_dispatch, upload=true        -> archive with Xcode cloud signing and upload to TestFlight.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_P8      full contents of the App Store Connect API key (.p8), PEM text as-is
#   ASC_KEY_ID      the key's Key ID
#   ASC_ISSUER_ID   the Issuer ID shown above the keys table
# Repository variable:
#   APPLE_TEAM_ID   ten-character Apple Developer team ID
#
# The API key needs the Admin role, or App Manager with "Access to Cloud Managed Distribution
# Certificate" enabled, so xcodebuild can create and use cloud-managed signing.

name: TestFlight

on:
  push:
    paths:
      - "apps/house-capture/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive, sign and upload to TestFlight (off = compile check only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  SCHEME: HouseCapture
  BUNDLE_ID: com.houseofgiants.housecapture
  APP_DIR: apps/house-capture

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload == true }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        env:
          HAS_P8: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          # runner.temp is not available in job-level env; set work paths here.
          {
            echo "ASC_KEY_DIR=$RUNNER_TEMP/asc"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/HouseCapture.xcarchive"
            echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData"
            echo "LOG_DIR=$RUNNER_TEMP/logs"
          } >> "$GITHUB_ENV"
          LOG_DIR="$RUNNER_TEMP/logs"
          echo "mode: $([ "$UPLOAD" = "true" ] && echo 'archive + TestFlight upload' || echo 'compile check only')"
          echo "build number: $BUILD_NUMBER"
          if [ "$UPLOAD" = "true" ]; then
            missing=""
            [ "$HAS_P8" = "true" ]      || missing="$missing ASC_KEY_P8"
            [ -n "$ASC_KEY_ID" ]        || missing="$missing ASC_KEY_ID"
            [ -n "$ASC_ISSUER_ID" ]     || missing="$missing ASC_ISSUER_ID"
            [ -n "$APPLE_TEAM_ID" ]     || missing="$missing APPLE_TEAM_ID(variable)"
            if [ -n "$missing" ]; then
              echo "::error::Upload requested but missing:$missing"
              exit 1
            fi
          fi
          mkdir -p "$LOG_DIR"

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        working-directory: ${{ env.APP_DIR }}
        run: |
          xcodegen generate
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" HouseCapture.xcodeproj/project.pbxproj \
            || { echo "::error::bundle id in generated project is not $BUNDLE_ID"; exit 1; }

      - name: Compile check (unsigned)
        if: env.UPLOAD != 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project HouseCapture.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$LOG_DIR/compile.log" | grep -E "error:|warning: .*deprecated|BUILD|Compiling|Ld " || true
          grep -q "BUILD SUCCEEDED" "$LOG_DIR/compile.log"

      - name: Write App Store Connect API key
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$ASC_KEY_DIR" && chmod 700 "$ASC_KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          head -1 "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "::error::ASC_KEY_P8 does not look like a PEM private key"; exit 1; }

      - name: Archive (Xcode cloud signing)
        if: env.UPLOAD == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HouseCapture.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$LOG_DIR/archive.log" | grep -E "error:|Signing|Provisioning|ARCHIVE|Ld " || true
          grep -q "ARCHIVE SUCCEEDED" "$LOG_DIR/archive.log"

      - name: Upload to TestFlight
        if: env.UPLOAD == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$LOG_DIR/export.log"
          grep -q "EXPORT SUCCEEDED" "$LOG_DIR/export.log"
          echo "Build $BUILD_NUMBER uploaded. App Store Connect processes it in 10-30 min, then it appears under TestFlight."

      - name: Remove API key
        if: always()
        run: rm -rf "$ASC_KEY_DIR"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ github.run_number }}
          path: ${{ env.LOG_DIR }}
          retention-days: 7
          if-no-files-found: ignore
